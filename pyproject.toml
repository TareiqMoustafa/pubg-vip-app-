[project]
name = "lader-tareiq"
version = "2.2.2"
description = "Lader Tareiq — Smart License, OTA & Game Resource Manager"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.25.0,<0.28.0",
    "requests>=2.31.0,<3.0.0",
]

[tool.flet]
org = "com.ladertareiq.app"
product = "Lader Tareiq"
company = "Lader Tareiq"
copyright = "Copyright (c) 2026 Lader Tareiq"

[tool.flet.app]
path = "src"

[tool.flet.android]
permission.INTERNET = true
permission.ACCESS_NETWORK_STATE = true
permission.READ_EXTERNAL_STORAGE = true
permission.WRITE_EXTERNAL_STORAGE = true
permission.MANAGE_EXTERNAL_STORAGE = true
permission.REQUEST_INSTALL_PACKAGES = true
