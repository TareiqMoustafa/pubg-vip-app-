name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev clang cmake ninja-build pkg-config unzip curl git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Flet and dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install "flet>=0.25.0,<0.28.0" "requests>=2.31.0,<3.0.0"
          fi

      - name: Verify Python syntax
        run: |
          python -m compileall -q src

      - name: Accept Android SDK licenses and check Flutter
        run: |
          if command -v flutter >/dev/null 2>&1; then
            yes | flutter doctor --android-licenses || true
            flutter doctor || true
          fi

      - name: Build APK with Flet
        id: flet_build
        run: |
          flet build apk --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lader-tareiq-apk
          path: build/apk/*.apk
          if-no-files-found: error
