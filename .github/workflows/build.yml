name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يتيح لك زر تشغيل يدوي من متصفحك متى شئت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود مشروعك من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تجهيز بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. تثبيت أداة Flet والمكتبات المطلوبة (مثل requests)
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet requests

      # 4. بناء ملف الـ APK للأندرويد بشكل تلقائي
      - name: Build Android APK
        run: |
          flet build apk --verbose

      # 5. رفع ملف الـ APK الناتج ليكون متاحاً للتحميل المباشر
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-vip-apk
          path: build/apk/*.apk
