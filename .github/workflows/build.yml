name: Build Flet APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Project Layout
        run: |
          ls -la
          ls -la src
          test -f src/main.py

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev clang cmake ninja-build pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT" -name "sdkmanager" -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet-cli==1.0.*" "flet==1.0.*" httpx

      - name: Build APK
        run: |
          flet build apk --yes --verbose --build-number ${{ github.run_number }} || {
            echo "=== Running serious_python directly to expose exact error ==="
            /home/runner/flutter/*/bin/dart run serious_python:main package src \
              --platform Android \
              --arch arm64-v8a \
              -r "flet==1.0.*" \
              -r "httpx>=0.27,<1.0" \
              --verbose
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pubg-vip-apk-tareiq
          path: build/apk/*.apk
          if-no-files-found: error
          retention-days: 14
